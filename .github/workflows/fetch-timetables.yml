name: fetch-timetables
on:
  push:
    paths:
      - ".github/workflows/fetch-timetables.yml"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq poppler-utils html2text >/dev/null

      - name: Fetch timetable sources
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          fetch_full() {
            echo ""
            echo "===== SOURCE: $1 ====="
            curl -sL --max-time 45 -A "$UA" "$1" -o /tmp/page || { echo "FETCH FAILED"; return 0; }
            html2text -utf8 -width 110 /tmp/page 2>/dev/null | head -"${2:-600}"
            echo "===== END SOURCE ====="
          }
          fetch_times() {
            echo ""
            echo "===== SOURCE: $1 ====="
            curl -sL --max-time 45 -A "$UA" "$1" -o /tmp/page || { echo "FETCH FAILED"; return 0; }
            html2text -utf8 /tmp/page 2>/dev/null | grep -E -B1 -A2 '[0-2]?[0-9][:.][0-5][0-9]' | head -300
            echo "===== END SOURCE ====="
          }
          fetch_full "https://laziomar.it/en/timetables/anzio-ponza-and-vice-versa" 500
          fetch_full "https://laziomar.it/en/timetables/formia-ponza-and-vice-versa" 900
          fetch_times "https://www.naplesbayferry.com/it/t/capri/napoli"
          fetch_times "https://www.naplesbayferry.com/it/t/napoli/ischia"
          fetch_times "https://www.naplesbayferry.com/it/t/ischia/napoli"
          fetch_times "https://www.naplesbayferry.com/it/t/napoli/casamicciola"
          fetch_times "https://www.naplesbayferry.com/it/t/casamicciola/napoli"
          fetch_times "https://www.naplesbayferry.com/it/t/pozzuoli/procida"
          fetch_times "https://www.naplesbayferry.com/it/t/procida/pozzuoli"
          fetch_times "https://easy.medmargroup.it/it/orari-tratta/Napoli-Ischia/"
          fetch_times "https://easy.medmargroup.it/it/orari-tratta/Ischia-Napoli/"
          fetch_times "https://easy.medmargroup.it/it/orari-tratta/Pozzuoli-Ischia/"
          fetch_times "https://agency.toremar.it/rotte/traghetti-elba/piombino-portoferraio-piombino/"
          fetch_times "https://www.traghettilines.it/it/elba/traghetti-piombino-portoferraio.aspx"
          fetch_times "https://it.netferry.com/traghetti/da/piombino/portoferraio"
          fetch_times "https://www.traghettilines.it/it/favignana/traghetti-trapani-favignana.aspx"
          fetch_times "https://it.netferry.com/traghetti/da/trapani/favignana"
          fetch_full "https://www.gestour.it" 200
          fetch_times "https://www.elladetraghetti.it/it/traghetti-piombino-portoferraio-moby"
          echo "ALL DONE"
