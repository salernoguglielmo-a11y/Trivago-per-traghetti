name: fetch-timetables
on:
  push:
    paths:
      - ".github/workflows/fetch-timetables.yml"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq html2text >/dev/null

      - name: Fetch and check
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          fetch_full() {
            echo ""
            echo "===== SOURCE: $1 ====="
            curl -sL --max-time 45 -A "$UA" "$1" -o /tmp/page || { echo "FETCH FAILED"; return 0; }
            html2text -utf8 -width 130 /tmp/page 2>/dev/null | head -"${2:-350}"
            echo "===== END SOURCE ====="
          }
          check() {
            out=$(curl -s -o /dev/null --max-time 30 -A "$UA" -w "%{http_code} %{url_effective}" -L "$1")
            echo "CHECK $out <= $1"
          }
          fetch_full "https://www.monicapmslivorno.eu/SERVIZIWEB/piombino/tabellone/partenze" 400
          fetch_full "https://www.monicapmslivorno.eu/SERVIZIWEB/portoferraio/tabellone/partenze" 400
          fetch_full "https://blunavytraghetti.com/en/elba-island-ferry-schedules/" 300
          fetch_full "https://www.traghetti-elba.it/tratte/traghetti-piombino-portoferraio.htm" 350
          fetch_full "https://www.elladetraghetti.it/it/traghetti-trapani-favignana-siremar" 300
          fetch_full "https://www.traghetti.com/siremar/trapani-favignana" 350
          check "https://www.traghetti.com/traghetti-ischia/traghetti-napoli-ischia"
          check "https://www.traghetti.com/traghetti-ischia/traghetti-ischia-napoli"
          check "https://www.traghetti.com/traghetti-procida/traghetti-pozzuoli-procida"
          check "https://www.traghetti.com/traghetti-procida/traghetti-procida-pozzuoli"
          check "https://www.traghetti.com/traghetti-capri/traghetti-capri-napoli"
          check "https://www.traghetti.com/traghetti-isola-di-ponza/traghetti-formia-ponza"
          check "https://www.traghetti.com/traghetti-isola-di-ponza/traghetti-ponza-anzio"
          check "https://www.traghetti.com/traghetti-isola-di-ponza/traghetti-ponza-formia"
          check "https://www.traghetti.com/traghetti-toscana/traghetti-piombino-portoferraio"
          check "https://www.traghetti.com/traghetti-isola-elba/traghetti-portoferraio-piombino"
          check "https://www.traghetti.com/traghetti-isole-egadi/traghetti-trapani-favignana"
          check "https://www.traghetti.com/traghetti-isole-egadi/traghetti-favignana-trapani"
          echo "ALL DONE"
