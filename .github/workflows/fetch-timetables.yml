name: fetch-timetables
on:
  push:
    paths:
      - ".github/workflows/fetch-timetables.yml"
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq poppler-utils html2text >/dev/null

      - name: Fetch timetable sources
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          fetch_full() {
            echo ""
            echo "===== SOURCE: $1 ====="
            curl -sL --max-time 45 -A "$UA" "$1" -o /tmp/page || { echo "FETCH FAILED"; return 0; }
            html2text -utf8 -width 110 /tmp/page 2>/dev/null | head -"${2:-600}"
            echo "===== END SOURCE ====="
          }
          fetch_times() {
            echo ""
            echo "===== SOURCE: $1 ====="
            curl -sL --max-time 45 -A "$UA" "$1" -o /tmp/page || { echo "FETCH FAILED"; return 0; }
            html2text -utf8 /tmp/page 2>/dev/null | grep -E -B1 -A2 '[0-2]?[0-9][:.][0-5][0-9]' | head -300
            echo "===== END SOURCE ====="
          }
          # Round 3: attribuzione compagnie Capri->Napoli, ritorni Elba, Medmar, Ventotene
          fetch_full "https://www.capri.net/en/ferry-schedule/capri/napoli" 700
          fetch_full "https://www.capri.net/en/ferry-schedule?from=capri&to=napoli" 700
          fetch_times "https://www.capri.net/it/orari-traghetti/capri/napoli"
          fetch_times "https://www.infoelba.it/come-arrivare/traghetti/orari-e-prezzi/"
          fetch_times "https://www.infoelba.it/come-arrivare/traghetti/"
          fetch_times "https://www.elbalink.it/traghetti-elba/orari"
          fetch_times "https://it.netferry.com/traghetti/da/portoferraio/piombino"
          fetch_times "https://www.medmargroup.it/orari-e-prezzi"
          fetch_times "https://www.medmargroup.it/"
          fetch_full "https://laziomar.it/en/timetables/formia-ventotene-and-vice-versa" 900
          fetch_times "https://www.naplesbayferry.com/it/t/napoli/capri"
          fetch_times "https://www.naplesbayferry.com/it/t/ischia/pozzuoli"
          fetch_times "https://www.naplesbayferry.com/it/t/pozzuoli/ischia"
          echo "ALL DONE"
